# ── Local mode ────────────────────────────────────────────────────────────
# Runs entirely on your own hardware — no Anthropic/OpenAI key, no per-token
# cost, nothing sent to a cloud LLM. Search (Exa) and Twitter (getxapi) still
# need the internet — they're retrieval services, not something a local
# model can do — but the actual reasoning (deciding what's newsworthy,
# deduplicating, writing summaries) runs on your machine.
#
# This is a real, working config (with the topics/sources trimmed down for a
# shorter example) — update the local_server_exe / local_model_path below to
# match your own llama.cpp install and GGUF model, then:
#   python -m newsletter.pipeline --test examples/local.yaml

name: example-local
file_name: example-local

search_queries:
  - AI model releases benchmarks open source weights
  - AI agents agentic workflows autonomous systems
  - AI startup funding investment rounds

research_papers:
  queries:
    - LLM reasoning planning alignment safety
    - AI agents autonomous systems tool use
  sources:
    - arxiv.org
    - nature.com
    - openreview.net

twitter_accounts:
  - sama
  - karpathy
  - DarioAmodei

# Blogposts & podcasts — each entry's `url` must be a direct RSS/Atom feed URL
# (no autodiscovery, no scraping fallback). Content older than recency_days is
# ignored. A URL that fails to fetch or doesn't parse as a feed is skipped with
# a warning at run time. Edit prompts/blog-podcast-summary.md to change how
# these are written.
blog_podcasts:
  - name: Anthropic News
    url: https://raw.githubusercontent.com/Olshansk/rss-feeds/main/feeds/feed_anthropic_news.xml
  - name: Simon Willison
    url: https://simonwillison.net/atom/everything/

recency_days: 7

# Results fetched per item, before any filtering. Each section has its own
# knob. Twitter has none: every post an account made in the window is
# summarized.
news_results: 5             # per search_queries entry
paper_results: 5            # per research_papers.queries entry
blog_podcast_results: 5     # per blog_podcasts entry, most-recent-first within recency_days

# Summarization — every article and paper is condensed to 100-150 words from
# its own page text (bundled free with the Exa search) before anything else
# happens. Both filter passes judge that summary, and it is what gets printed.
# Edit prompts/summarize.md to change how summaries are written.
#
# Newsworthiness filter — runs on every fetched news article to decide keep/drop.
# If llama-server isn't already running at local_base_url, the pipeline starts
# it automatically using local_server_exe + local_model_path + local_server_args,
# and stops it again when the run finishes. `model` is a label only when provider
# is local (llama-server ignores it) — used just for the run log and cost tracker.
#
# local_server_args: --reasoning-budget 2048 caps hidden <think> reasoning at
# 2048 tokens (0 disables it entirely, which caused a degenerate "keep everything"
# response on batch judgment tasks like dedup/filter — some reasoning budget is
# needed for cross-referencing many items, not just single-fact lookups).
# --reasoning-budget-message forces a graceful wrap-up instead of an abrupt
# mid-thought cutoff when the budget is hit. --split-mode tensor is enabled
# since this is the MoE Gemma variant (A4B = active-4B MoE) — ~16% faster
# decode than layer-mode on MoE models; remove it (and --split-mode) for a
# dense model, along with -lv 1 (verbose logging — drop it for quieter output).
filter:
  provider: local
  model: gemma-4-26B-A4B-it
  local_base_url: http://localhost:8080/v1
  local_server_exe: D:\llama.cpp\llama-server.exe
  local_model_path: D:\llama-models\gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
  local_server_args:
    - --host
    - 127.0.0.1
    - -c
    - 32768
    - -ngl
    - 999
    - --split-mode
    - tensor
    - --reasoning-budget
    - 2048
    - --reasoning-budget-message
    - "Time is up. Provide your final answer now."
    - --no-mmap
    - -lv
    - 1

# Summarization — condenses every article/paper to 100-150 words before any
# filtering. Can be a different provider/model than `filter` (e.g. filter on a
# small fast model, summarize on a larger one) — omit this block entirely to
# reuse the filter block as-is.
summarize:
  provider: local
  model: gemma-4-26B-A4B-it
  local_base_url: http://localhost:8080/v1
  local_server_exe: D:\llama.cpp\llama-server.exe
  local_model_path: D:\llama-models\gemma-4-26B-A4B-it-UD-Q4_K_M.gguf
  local_server_args:
    - --host
    - 127.0.0.1
    - -c
    - 32768
    - -ngl
    - 999
    - --split-mode
    - tensor
    - --reasoning-budget
    - 2048
    - --reasoning-budget-message
    - "Time is up. Provide your final answer now."
    - --no-mmap
    - -lv
    - 1
