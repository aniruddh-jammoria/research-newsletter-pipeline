# ── Local mode ────────────────────────────────────────────────────────────
# Runs entirely on your own hardware — no Anthropic/OpenAI key, no per-token
# cost, nothing sent to a cloud LLM. Search (Exa) and Twitter (getxapi) still
# need the internet — they're retrieval services, not something a local
# model can do — but the actual reasoning (deciding what's newsworthy,
# deduplicating, writing summaries) runs on your machine.
#
# Requires llama.cpp installed locally and a GGUF model downloaded. Update
# the three local_* paths below to match your setup, then:
#   python -m newsletter.pipeline --test examples/local.yaml

name: example-local
file_name: example-local

# `mode: local` sets the default provider for both the filter and summarize
# steps to `local`. Everything below is shared by both steps — set it once
# instead of duplicating a filter: and summarize: block.
mode: local
model: gemma-4-26B-A4B-it
local_base_url: http://localhost:8080/v1
local_server_exe: D:\llama.cpp\llama-server.exe
local_model_path: D:\llama-models\gemma-4-26B-A4B-it-UD-Q4_K_M.gguf

# Passed straight through to llama-server. --reasoning-budget 0 (fully
# disabling "thinking") caused this model to default to keeping everything
# on batch judgment tasks like dedup/filtering — verified by testing. A
# moderate budget with a graceful wrap-up message restores real judgment.
local_server_args:
  - --host
  - 127.0.0.1
  - -c
  - 32768
  - -ngl
  - 999
  - --split-mode          # only for MoE models (filenames with an "A#B" suffix) — remove for dense models
  - tensor
  - --reasoning-budget
  - 2048
  - --reasoning-budget-message
  - "Time is up. Provide your final answer now."
  - --no-mmap

search_queries:
  - AI model releases benchmarks open source weights
  - AI startup funding investment rounds
  - AI regulation policy safety US EU

research_papers:
  queries:
    - LLM reasoning planning alignment safety
  sources:
    - arxiv.org
    - nature.com

recency_days: 7

# Results fetched per item, before any filtering. Each section has its own knob.
# Twitter has none: every post an account made in the window is summarized.
news_results: 5    # per search_queries entry
paper_results: 5   # per research_papers.queries entry

# Nothing more to configure — filter: and summarize: both inherit everything
# from `mode` and the shared keys above. The pipeline auto-starts
# llama-server if it isn't already running, and stops it when the run ends.
#
# Every article is condensed to 100-150 words by the local model before any
# filtering happens, so nothing but retrieval touches the network.
filter: {}
summarize: {}
